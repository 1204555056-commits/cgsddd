<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>NARUTOMVU</title>
    <style>
        @import url("https://fontsapi.zeoseven.com/35/main/result.css");
        @import url("https://fontsapi.zeoseven.com/72/main/result.css");
        @import url("https://fontsapi.zeoseven.com/646/main/result.css");

        /* Basic resets */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100%;
            background-color: #eaddc5;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.08"/></svg>');
            font-family: "DYmingA", serif;
            font-weight: normal;
            color: #2c2724;
            overflow-x: hidden;
            font-size: 15px;
        }

        /* Top Header */
        .top-scroll {
            width: 100%;
            padding: 10px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px dashed #4a4036;
            background: linear-gradient(180deg, rgba(234,221,197,1) 0%, rgba(224,208,179,1) 100%);
            box-shadow: 0 4px 6px -4px rgba(0,0,0,0.3);
        }

        .world-status {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 0 15px;
        }

        .world-status.left {
            text-align: left;
            align-items: flex-start;
        }

        .world-status.right {
            text-align: right;
            align-items: flex-end;
        }

        .logo-center {
            flex: 0 0 auto;
            width: 60px;
            aspect-ratio: 1;
            margin: 0;
        }

        .logo-center img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .world-time-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-text {
            color: #2c2724;
            font-size: 16px;
            font-weight: bold;
        }

        .header-subtext {
            color: #555;
            font-size: 14px;
        }

        /* Accordion buttons */
        .plaque-container {
            display: flex;
            width: 100%;
            border-bottom: 2px solid #3e332a;
            background: #4a3b2c;
        }

        .plaque-btn {
            flex: 1;
            background: linear-gradient(to bottom, #8c6b4a, #5c432a);
            color: #eaddc5;
            border: 1px solid #3e2a18;
            border-top: none;
            border-bottom: none;
            text-align: center;
            padding: 8px 0;
            cursor: pointer;
            font-family: "Zhi Mang Xing", cursive;
            font-size: 18px;
            transition: all 0.3s ease;
            text-shadow: 1px 1px 2px #000;
        }

        .plaque-btn:first-child { border-left: none; }
        .plaque-btn:last-child { border-right: none; }

        .plaque-btn:hover, .plaque-btn.active {
            background: linear-gradient(to bottom, #a68461, #735537);
            transform: scaleY(1.05);
            transform-origin: top;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            color: #fff;
            z-index: 2;
        }

        /* Content panels */
        .content-area {
            width: 100%;
            padding: 25px 20px;
            display: none;
            background: rgba(255,255,255,0.3);
            
            box-sizing: border-box;
        }
        .content-area.active {
            display: flex;
            flex-direction: row; /* Default for panel-main */
        }

        .content-area.active {
            display: flex;
        }

        /* Panel Main 3 columns */
        #panel-main {
            gap: 0;
            padding-top: 30px;
        }
        .main-col-left {
            flex: 1;
            padding-right: 20px;
            display: flex;
            flex-direction: column;
        }
        .main-col-center {
            flex: 1.4;
            padding: 0 25px;
            background-image:
                repeating-linear-gradient(to bottom, rgba(0,0,0,0.08) 0, rgba(0,0,0,0.08) 5px, transparent 5px, transparent 10px),
                repeating-linear-gradient(to bottom, rgba(0,0,0,0.08) 0, rgba(0,0,0,0.08) 5px, transparent 5px, transparent 10px);
            background-size: 1px 100%, 1px 100%;
            background-position: left top, right top;
            background-repeat: no-repeat, no-repeat;
        }
        .main-col-right {
            flex: 1.2;
            padding-left: 25px;
        }

        /* Left column: Avatar */
        .avatar-container {
            width: 100%;
            flex: 1;
            min-height: 0;
            position: relative;
            background: #d4c5b0;
            border: 2px solid #2c2724;
            clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 10px 100%, 0 calc(100% - 10px), 0 10px);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .avatar-inner-frame {
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px solid rgba(44,39,36,0.5);
            pointer-events: none;
            clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px);
            z-index: 2;
        }
        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        .avatar-upload-btn {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background-color: rgba(0,0,0,0.6);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.6);
            padding: 4px 8px;
            cursor: pointer;
            font-size: 12px;
            font-family: monospace;
            z-index: 3;
            transition: all 0.2s;
        }
        .avatar-upload-btn:hover {
            background-color: rgba(0,0,0,0.8);
            border-color: #fff;
        }
        .name-row {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 4px;
        }
        .name-text {
            font-family: "DYmingA", serif;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #000;
        }
        .age-text {
            font-size: 14px;
            color: #666;
        }
        .level-exp-row {
            display: flex;
            align-items: center;
            width: 100%;
        }
        .level-badge {
            background: #111;
            color: #fff;
            font-family: monospace;
            padding: 3px 8px 3px 6px;
            font-size: 13px;
            font-weight: bold;
            clip-path: polygon(0 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
            z-index: 2;
        }
        .exp-bar-container {
            flex: 1;
            height: 6px;
            background: rgba(0,0,0,0.15);
            margin-left: -4px;
            position: relative;
            z-index: 1;
        }
        .exp-bar-fill {
            height: 100%;
            background: #d4af37;
            transition: width 0.3s;
        }
        .exp-text {
            font-family: monospace;
            font-size: 14px;
            font-weight: bold;
            margin-left: 8px;
        }

        /* Center column */
        .status-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .status-icon {
            width: 24px;
            height: 24px;
        }
        .status-bar-container {
            flex: 1;
            height: 8px;
            background: rgba(0,0,0,0.1);
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.15);
            position: relative;
        }
        .status-bar-fill {
            height: 100%;
            transition: width 0.3s;
        }
        .status-hp .status-bar-fill { background: #4a7c59; }
        .status-hp svg { fill: #4a7c59; }
        .status-chakra .status-bar-fill { background: #3b5998; }
        .status-chakra svg { fill: #3b5998; }
        .status-mind .status-bar-fill { background: #6b5b95; }
        .status-mind svg { fill: #6b5b95; }
        .status-text {
            font-family: monospace;
            font-weight: bold;
            width: 70px;
            text-align: right;
            font-size: 15px;
        }

        .stats-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 30px;
            margin-bottom: 15px;
        }
        .stats-title {
            font-size: 22px;
            font-weight: bold;
            color: #111;
        }
        .stats-points {
            font-size: 15px;
            font-weight: bold;
            color: #777;
            transition: color 0.3s;
        }
        .stats-points.active {
            color: #b23a2a;
            animation: breathing 2s infinite;
        }
        @keyframes breathing {
            0% { text-shadow: 0 0 2px rgba(178,58,42,0.1); }
            50% { text-shadow: 0 0 8px rgba(178,58,42,0.6); }
            100% { text-shadow: 0 0 2px rgba(178,58,42,0.1); }
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 15px;
        }
        .stat-box {
            border: 1px solid rgba(62, 51, 42, 0.4);
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 15px;
            padding-bottom: 8px;
            position: relative;
        }
        .stat-kanji {
            font-family: "Zhi Mang Xing", cursive;
            font-size: 32px;
            font-weight: bold;
            color: #111;
            line-height: 1;
        }
        .stat-num {
            font-family: monospace;
            font-size: 18px;
            margin-top: 6px;
            font-weight: bold;
            color: #111;
        }
        .stat-controls {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            width: 100%;
            justify-content: center;
        }
        .stat-btn {
            cursor: pointer;
            background: #2c2724;
            color: #eaddc5;
            border: none;
            width: 20px;
            height: 20px;
            line-height: 18px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
        }
        .stat-btn:hover { background: #b23a2a; }
        .stat-btn:disabled { background: transparent; color: #999; cursor: not-allowed; border: 1px dashed #999; }

        /* Right column */
        .right-section { margin-bottom: 24px; }
        .right-title {
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            color: #111;
        }
        .right-title svg {
            width: 20px;
            height: 20px;
            fill: #111;
        }
        .identity-tag {
            display: inline-block;
            background: #2c2724;
            color: #eaddc5;
            padding: 6px 12px;
            font-size: 15px;
            font-weight: bold;
        }
        .damage-box {
            background: #2a2020;
            color: #d66;
            padding: 12px;
            font-weight: bold;
            font-size: 16px;
            border-left: 5px solid #b23a2a;
            line-height: 1.4;
        }
        .desc-text {
            font-size: 16px;
            line-height: 1.6;
            color: #1a1a1a;
            font-weight: bold;
            font-family: "DYmingA", serif;
        }
        .separator-line {
            width: 100%;
            height: 1px;
            border-bottom: 1px dashed rgba(0,0,0,0.15);
            margin: 20px 0;
        }
        .ejac-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
        }
        .ejac-bar-container {
            height: 8px;
            background: rgba(0,0,0,0.1);
            flex: 1;
        }
        .ejac-bar-fill {
            height: 100%;
            background: #722f37;
            transition: width 0.3s;
        }
        .ejac-text {
            font-family: monospace;
            font-size: 15px;
            font-weight: bold;
        }

        /* 动产区块 Phase 3 */
        #panel-movable {
            padding: 0 !important;
            display: flex;
            flex-direction: column;
            height: 100%;
            background: transparent;
        }
        .movable-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 2px solid #3e332a;
            background: #4a3b2c;
            padding: 0 10px;
        }
        .movable-tabs {
            display: flex;
            align-items: flex-end;
        }
        .movable-tab {
            padding: 8px 16px;
            background: #2a2015;
            color: #888;
            cursor: pointer;
            font-weight: normal;
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
            margin-right: 4px;
            transition: all 0.2s;
            font-size: 15px;
        }
        .movable-tab.active {
            background: #5c4a38;
            color: #eaddc5;
            font-weight: bold;
            border-bottom: 2px solid #b23a2a;
        }
        .movable-money {
            display: flex;
            align-items: center;
            gap: 4px;
            padding-bottom: 8px;
            color: #d69e2e;
        }
        .money-label { color: #aaa; font-size: 14px; }
        .money-value { font-family: monospace; font-size: 16px; min-width: 80px; text-align: right; }
        .money-suffix { font-size: 14px; }

        .movable-body {
            display: flex;
            flex: 1;
            background: rgba(255,255,255,0.4);
            min-height: 400px;
        }
        .movable-list {
            overflow-x: hidden;
            flex: 0 0 30%;
            border-right: 1px dashed rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            max-height: 550px;
        }
        .movable-list-item {
            padding: 10px 15px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
            transition: background 0.2s;
        }
        .movable-list-item:hover { background: rgba(0,0,0,0.05); }
        .movable-list-item.active { background: rgba(200,180,150,0.4); }
        .movable-list-item.active::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 2px;
            background: #b23a2a;
        }
        .movable-list-item-row { display: flex; justify-content: space-between; align-items: center; }
        .m-item-title { font-size: 14px; font-weight: bold; font-family: "DYmingA", serif; }
        .m-item-qty { font-family: monospace; font-size: 12px; color: #555; }
        .m-item-badge { font-size: 11px; padding: 2px 4px; border: 1px solid rgba(0,0,0,0.3); border-radius: 2px; }
        .m-item-badge.core { border-color: #D69E2E; color: #D69E2E; }
        .m-item-badge.worn { background: #2f4f4f; color: #fff; border-color: #2f4f4f; }
        .m-item-badge.unworn { border-color: #666; color: #666; }

        .movable-detail {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 2px solid transparent;
            padding-bottom: 10px;
        }
        .detail-title {
            font-size: 18px;
            font-weight: bold;
            font-family: "DYmingA", serif;
        }
        .detail-badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .detail-badge-box {
            border: 1px solid rgba(0,0,0,0.3);
            padding: 4px 8px;
            font-size: 12px;
            background: rgba(0,0,0,0.05);
            font-family: "DYmingA", serif;
        }

        .detail-box-container {
            background: rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.15);
            border-radius: 3px;
            padding: 12px 16px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            min-height: 60px;
        }
        .detail-section-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .detail-section-title::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 14px;
            background: #b23a2a;
        }
        .detail-text {
            font-size: 13px;
            line-height: 1.6;
        }
        .detail-bottom-cabin {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .cabin-row {
            border: 1px dashed rgba(0,0,0,0.2);
            padding: 6px 10px;
            font-size: 11px;
            font-style: italic;
            color: #4a4a4a;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
        }

        /* Colors for Rarities */
        .color-普通 { color: #A0AEC0; }
        .color-稀有 { color: #63B3ED; }
        .color-史诗 { color: #B794F4; }
        .color-传说, .color-核心 { color: #D69E2E; }
        .color-六道级 { color: #E53E3E; }

        .grad-普通 { border-bottom-color: #A0AEC0 !important; }
        .grad-稀有 { border-bottom-color: #63B3ED !important; }
        .grad-史诗 { border-bottom-color: #B794F4 !important; }
        .grad-传说, .grad-核心 { border-bottom-color: #D69E2E !important; }
        .grad-六道级 { border-bottom-color: #E53E3E !important; }

        /* Progress Bar for Storage */
        .hide-progress-bar {
            width: 100%;
            height: 4px;
            background: #ccc;
            margin-top: 4px;
            position: relative;
        }
        .hide-progress-fill {
            height: 100%;
            transition: width 0.3s;
        }

        /* 不动产区块 Phase 4 */
        #panel-realestate {
            padding: 0 !important;
            display: flex;
            flex-direction: column;
            height: 100%;
            background: transparent;
        }

        .re-list-item {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            transition: background 0.2s;
        }
        .re-list-item:hover { background: rgba(0,0,0,0.05); }
        .re-list-item.active { background: rgba(200,180,150,0.4); }
        .re-list-item.active::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 2px;
            background: #b23a2a;
        }
        .re-item-title { font-size: 14px; font-weight: bold; font-family: "DYmingA", serif; }
        .re-item-title.house { color: #854D0E; }
        .re-item-title.special { color: #1E3A8A; }
        .re-item-badge { font-size: 11px; padding: 2px 4px; border: 1px solid rgba(0,0,0,0.3); border-radius: 2px; color: #57534E; }

        .re-detail-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .re-detail-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px dashed rgba(0,0,0,0.2);
            padding-bottom: 12px;
        }
        .re-detail-title {
            font-size: 20px;
            font-weight: bold;
            font-family: "DYmingA", serif;
        }
        .re-detail-title.house { color: #713F12; }
        .re-detail-title.special { color: #1E3A8A; }
        .re-loc-row {
            margin-top: 8px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .re-loc-row.house { color: #57534E; font-weight: bold; }
        .re-loc-row.special { color: #334155; }

        .re-section-title {
            font-size: 14px;
            font-weight: bold;
            color: #1C1917;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .re-section-title.house-activity {
            font-size: 15px;
            color: #991B1B;
        }

        .re-box {
            background: rgba(0,0,0,0.03);
            border: 1px solid rgba(0,0,0,0.15);
            padding: 12px;
            border-radius: 2px;
            font-size: 13px;
            color: #292524;
            line-height: 1.6;
        }
        .re-box.special-min { min-height: 180px; }
        .re-box-line {
            height: 1px;
            border-bottom: 1px dashed rgba(0,0,0,0.2);
            margin: 10px 0;
        }

        .re-activity-box {
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.05"/></svg>'), rgba(255,255,255,0.4);
            border: 1px solid rgba(153, 27, 27, 0.3);
            padding: 12px 16px;
            border-left: 3px solid #991B1B;
            position: relative;
            color: #0C0A09;
            font-family: "XiangcuiDengcusong", "DYmingA", serif !important;
            font-size: 16px !important;
            font-weight: bold;
            line-height: 1.7;
        }
        .re-breath-dot {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10B981;
            box-shadow: 0 0 4px #10B981;
            animation: breathDot 2s infinite;
        }
        @keyframes breathDot {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        
        .detail-text, .re-box, .cabin-row {
            font-family: "XiangcuiDengcusong", "DYmingA", serif !important;
            font-weight: bold !important;
            font-size: 16px !important;
            color: #1c1917 !important;
            line-height: 1.8 !important;
        }
        .re-box.special-min {
            min-height: 250px !important;
            font-size: 18px !important;

            <div class="movable-money">
                <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:#d69e2e;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-3-9h6v2H9v-2z"/></svg>

    <div id="panel-realestate" class="content-area other-panel">

        <div class="movable-header">
            <div class="movable-tabs" id="social-tabs">
                <div class="movable-tab active" data-cat="在场">在场</div>

            <div class="movable-list" id="social-list" style="flex: 0 0 16%; background:rgba(255,255,255,0.2); border-right: 1px dashed rgba(0,0,0,0.15); min-height: 100%; display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; padding-bottom: 20px;"></div>

        <div class="movable-header">
            <div class="movable-tabs" id="org-tabs">
                <div class="movable-tab active" data-cat="据点">据点</div>
                <div class="movable-tab" data-cat="干部">干部</div>
                <div class="movable-tab" data-cat="部队">部队</div>

            <div class="movable-list" id="org-list" style="flex: 0 0 25%; background:rgba(255,255,255,0.2); border-right: 1px dashed rgba(0,0,0,0.15); min-height: 100%; display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; padding-bottom: 20px;"></div>

        <div class="movable-header">
            <div class="movable-tabs" id="task-tabs">
                <div class="movable-tab active" data-cat="个人修炼">个人修炼</div>
                <div class="movable-tab" data-cat="个人事项">个人事项</div>
                <div class="movable-tab" data-cat="长期任务">长期任务</div>
                <div class="movable-tab" data-cat="短期任务">短期任务</div>
                <div class="movable-tab" data-cat="循环事件">循环事件</div>
            </div>
        </div>
        <div class="movable-body" style="align-items: stretch;">
            <div class="movable-list" id="task-list" style="flex: 0 0 25%; background:rgba(255,255,255,0.2); border-right: 1px dashed rgba(0,0,0,0.15); min-height: 100%; display: flex; flex-direction: column; overflow-y: auto; overflow-x: hidden; padding-bottom: 20px;"></div>
            <div class="movable-detail" id="task-detail" style="flex: 1; padding: 20px; overflow-y: auto; height: 100%;"></div>
        </div>
    </div>
    <div id="panel-cards" class="content-area other-panel" style="background: radial-gradient(circle, #250505 0%, #0a0101 100%) !important; border: 2px solid #5a0c0c !important; box-shadow: 0 0 25px rgba(120, 0, 0, 0.6) !important; padding: 20px !important;"></div>

    <script>
        $(errorCatched(async () => {
            await waitGlobalInitialized('Mvu');

            /* Accordion logic */
            $('.plaque-btn').on('click', function() {
                $('.plaque-btn').removeClass('active');
                $(this).addClass('active');
                $('.content-area').removeClass('active');
                $('#' + $(this).data('target')).addClass('active');
            });

            /* Upload Avatar logic */
            $('#btn-upload-avatar').on('click', function() {
                const newUrl = prompt("请输入新立绘的图片URL：");
                if (newUrl !== null) {
                    try {
                        Mvu.setMvuVariable('stat_data.主角数据.头像立绘', newUrl);
                    } catch(e) {
                        console.error('Update avatar failed:', e);
                    }
                }
            });

            /* Bind attributes increase/decrease */
            const keys = ['忍','体','幻','智','力','速','精','印'];
            const attrPaths = {};
            keys.forEach(k => {
                attrPaths[k] = `stat_data.主角数据.八维属性.加点分配.${k}`;
            });

            $(document).on('click', '.stat-btn.add', function() {
                const k = $(this).data('key');
                const vars = getAllVariables();
                const apPath = 'stat_data.主角数据.八维属性.可用属性点';
                let ap = _.get(vars, apPath, 0);
                if (ap > 0) {
                    let val = _.get(vars, attrPaths[k], 1);
                    if (val < 20) {
                        try {
                            // Batch update
                            let parentPath = 'stat_data.主角数据.八维属性';
                            let parentObj = _.cloneDeep(_.get(vars, parentPath, {}));
                            parentObj.可用属性点 = ap - 1;
                            if(!parentObj.加点分配) parentObj.加点分配 = {};
                            parentObj.加点分配[k] = val + 1;
                            Mvu.setMvuVariable(parentPath, parentObj);
                        } catch(e){}
                    }
                }
            });

            $(document).on('click', '.stat-btn.sub', function() {
                const k = $(this).data('key');
                const vars = getAllVariables();
                const apPath = 'stat_data.主角数据.八维属性.可用属性点';
                let ap = _.get(vars, apPath, 0);
                let val = _.get(vars, attrPaths[k], 1);
                if (val > 0) {
                    try {
                        let parentPath = 'stat_data.主角数据.八维属性';
                            let parentObj = _.cloneDeep(_.get(vars, parentPath, {}));
                            parentObj.可用属性点 = ap + 1;
                            if(!parentObj.加点分配) parentObj.加点分配 = {};
                            parentObj.加点分配[k] = val - 1;
                            Mvu.setMvuVariable(parentPath, parentObj);
                    } catch(e){}
                }
            });

            const renderMain = (vars) => {
                /* Header data (no prefixes) */
                $('#world-time').text(_.get(vars, 'stat_data.世界运行情况.世界时间', 'YY年M月D日 HH:MM/星期'));
                $('#world-weather').text(_.get(vars, 'stat_data.世界运行情况.当前天气', '晴/25℃'));
                $('#world-location').text(_.get(vars, 'stat_data.世界运行情况.当前位置', '火之国·木叶隐村'));
                $('#world-main-quest').text(_.get(vars, 'stat_data.世界运行情况.当前世界主线', '待初始化'));

                /* Left Column */
                const avatar = _.get(vars, 'stat_data.主角数据.头像立绘', '');
                if (avatar) {
                    $('#avatar-img').attr('src', avatar).css('opacity', 1);
                } else {
                    $('#avatar-img').css('opacity', 0);
                }

                $('#char-name').text(_.get(vars, 'stat_data.主角数据.名称', '未知'));
                $('#char-age').text(_.get(vars, 'stat_data.主角数据.年龄', 12));
                $('#char-level').text('Lv.' + _.get(vars, 'stat_data.主角数据.等级', 1));

                const expStr = _.get(vars, 'stat_data.主角数据.经验', '0/100');
                $('#char-exp-text').text(expStr);
                const expParts = expStr.split('/');
                let expPct = 0;
                if (expParts.length === 2 && parseFloat(expParts[1]) > 0) {
                    expPct = (parseFloat(expParts[0]) / parseFloat(expParts[1])) * 100;
                    expPct = Math.min(Math.max(expPct, 0), 100);
                }
                $('#char-exp-bar').css('width', expPct + '%');

                /* Center Column */
                const hp = _.get(vars, 'stat_data.主角数据.状态.体力', 100);
                $('#bar-hp').css('width', hp + '%');
                $('#text-hp').text(hp + '%');

                const chakra = _.get(vars, 'stat_data.主角数据.状态.查克拉量', '100/100');
                $('#text-chakra').text(chakra);
                let chakraPct = 0;
                const chkParts = chakra.split('/');
                if (chkParts.length === 2 && parseFloat(chkParts[1]) > 0) {
                    chakraPct = (parseFloat(chkParts[0]) / parseFloat(chkParts[1])) * 100;
                    chakraPct = Math.min(Math.max(chakraPct, 0), 100);
                }
                $('#bar-chakra').css('width', chakraPct + '%');

                const mind = _.get(vars, 'stat_data.主角数据.状态.精神状态', 100);
                $('#bar-mind').css('width', mind + '%');
                $('#text-mind').text(mind + '%');

                const ap = _.get(vars, 'stat_data.主角数据.八维属性.可用属性点', 0);
                const $apNode = $('#stats-ap');
                $apNode.text('可用属性点: ' + ap);
                if (ap > 0) {
                    $apNode.addClass('active');
                } else {
                    $apNode.removeClass('active');
                }

                let statsHtml = '';
                keys.forEach(k => {
                    const val = _.get(vars, attrPaths[k], 1);
                    const btnAdd = ap > 0 ? '' : 'disabled';
                    const btnSub = val > 0 ? '' : 'disabled';
                    statsHtml += '<div class="stat-box">';
                    statsHtml += '<div class="stat-kanji">' + k + '</div>';
                    statsHtml += '<div class="stat-num">' + val + '</div>';
                    statsHtml += '<div class="stat-controls">';
                    statsHtml += '<button class="stat-btn sub" data-key="' + k + '" ' + btnSub + '>-</button>';
                    statsHtml += '<button class="stat-btn add" data-key="' + k + '" ' + btnAdd + '>+</button>';
                    statsHtml += '</div></div>';
                });
                $('#stats-grid').html(statsHtml);

                /* Right Column */
                const identity = _.get(vars, 'stat_data.主角数据.身份', '平民');
                let idHtml = '';
                identity.split('/').forEach(id => {
                    idHtml += '<div class="identity-tag" style="margin-right:8px; margin-bottom:8px;">' + id + '</div>';
                });
                $('#char-identity-container').html(idHtml);

                $('#char-damage').text(_.get(vars, 'stat_data.主角数据.身体永久损伤', '无'));
                $('#char-outfit').text(_.get(vars, 'stat_data.主角数据.着装', '[外套] + [内搭] + [下装] + [足具] + [配饰]'));
                $('#char-lower').text(_.get(vars, 'stat_data.主角数据.下体状态', '正常'));

                const ejac = _.get(vars, 'stat_data.主角数据.射精进度', 0);
                $('#char-ejac-bar').css('width', ejac + '%');
                $('#char-ejac-text').text(ejac + '%');
            };

            /* 动产部分逻辑 Phase 3 */
            let currentMovableTab = '核心道具';
            let currentSelectedItem = null;

            $('#movable-tabs').on('click', '.movable-tab', function() {
                $('.movable-tab').removeClass('active');
                $(this).addClass('active');
                currentMovableTab = $(this).data('cat');
                currentSelectedItem = null;
                renderMovablePanel(getAllVariables());
            });

            $('#movable-list').on('click', '.movable-list-item', function() {
                $('.movable-list-item').removeClass('active');
                $(this).addClass('active');
                currentSelectedItem = $(this).data('id');
                renderMovableDetail(getAllVariables());
            });

            const renderMovablePanel = (vars) => {
                const money = _.get(vars, 'stat_data.动产.金钱', 0);
                $('#val-money').text(money);

                const itemsObj = _.get(vars, `stat_data.动产.${currentMovableTab}`, {});
                const itemKeys = Object.keys(itemsObj);

                if (itemKeys.length === 0) {
                    $('#movable-list').html('<div style="padding:20px;text-align:center;color:#888;">暂无条目</div>');
                    $('#movable-detail').html('');
                    return;
                }

                if (!currentSelectedItem || !itemsObj[currentSelectedItem]) {
                    currentSelectedItem = itemKeys[0];
                }

                let listHtml = '';
                itemKeys.forEach(k => {
                    const item = itemsObj[k];
                    const isActive = (k === currentSelectedItem) ? 'active' : '';
                    let r1Left = k, r1Right = 'x' + (item.数量 || 1);
                    let r2Html = '';

                    const rarity = item.珍稀程度 || '普通';
                    const qualityColorClass = 'color-' + rarity;

                    if (currentMovableTab === '核心道具') {
                        r1Left = `<span class="m-item-title color-核心">${k}</span>`;
                        let imp = item.重要程度 || '核心';
                        r2Html = `<span class="m-item-badge core">[${imp}]</span>`;
                    } else if (currentMovableTab === '装备') {
                        r1Left = `<span class="m-item-title ${qualityColorClass}">${k}</span>`;
                        let worn = item.是否穿戴 === '是';
                        let wornClass = worn ? 'worn' : 'unworn';
                        let wornText = worn ? '已穿戴' : '未穿戴';
                        r2Html = `<span class="m-item-badge">[${rarity}]</span> <span class="m-item-badge ${wornClass}">[${wornText}]</span>`;
                    } else if (currentMovableTab === '道具') {
                        r1Left = `<span class="m-item-title ${qualityColorClass}">${k}</span>`;
                        r2Html = `<span class="m-item-badge">[${rarity}]</span>`;
                    } else if (currentMovableTab === '消耗品') {
                        r1Left = `<span class="m-item-title">${k}</span>`;
                    } else if (currentMovableTab === '仓储物') {
                        r1Left = `<span class="m-item-title">${k}</span>`;
                        r2Html = `<span class="m-item-badge" style="border-color:#8b4513;color:#8b4513;">[原:${item.动产类型 || '未知'}]</span>`;
                    }

                    listHtml += `
                        <div class="movable-list-item ${isActive}" data-id="${k}">
                            <div class="movable-list-item-row">
                                ${r1Left}
                                <span class="m-item-qty">${r1Right}</span>
                            </div>
                            ${r2Html ? `<div class="movable-list-item-row" style="justify-content:flex-start;gap:6px;">${r2Html}</div>` : ''}
                        </div>
                    `;
                });

                $('#movable-list').html(listHtml);
                renderMovableDetail(vars);
            };

            const renderMovableDetail = (vars) => {
                if (!currentSelectedItem) {
                    $('#movable-detail').html('');
                    return;
                }
                const item = _.get(vars, `stat_data.动产.${currentMovableTab}.${currentSelectedItem}`, {});
                let detailHtml = '';

                const rarity = item.珍稀程度 || '普通';
                const qualityGradClass = 'grad-' + rarity;
                const titleColorClass = currentMovableTab === '核心道具' ? 'color-核心' : (item.珍稀程度 ? `color-${rarity}` : '');

                let headerBadges = '';
                headerBadges += `<div class="detail-badge-box">[${currentMovableTab}]</div>`;
                if (currentMovableTab === '核心道具') {
                    headerBadges += `<div class="detail-badge-box">[重要程度: ${item.重要程度 || '核心'}]</div>`;
                } else if (item.珍稀程度) {
                    headerBadges += `<div class="detail-badge-box">[珍稀程度: ${rarity}]</div>`;
                }
                if (currentMovableTab === '仓储物') {
                    headerBadges += `<div class="detail-badge-box">[原类型: ${item.动产类型 || '未知'}]</div>`;
                }
                headerBadges += `<div class="detail-badge-box">[数量: x${item.数量 || 1}]</div>`;
                if (item.是否穿戴) {
                    headerBadges += `<div class="detail-badge-box">[${item.是否穿戴 === '是' ? '已穿戴' : '未穿戴'}]</div>`;
                }

                detailHtml += `
                    <div class="detail-header ${qualityGradClass}">
                        <div class="detail-title ${titleColorClass}" style="font-size:20px;">${currentSelectedItem}</div>
                        <div class="detail-badges">${headerBadges}</div>
                    </div>
                `;

                if (currentMovableTab === '仓储物') {
                    let hidden = item.隐秘性 || '0%';
                    let hiddenNum = parseFloat(hidden) || 0;
                    let barColor = hiddenNum > 50 ? '#4a7c59' : '#b23a2a';
                    detailHtml += `
                        <div class="detail-section-title">储藏档案与隐秘性</div>
                        <div class="detail-box-container" style="display:flex;flex-direction:column;gap:10px;">
                            <div>
                                <span style="font-weight:bold;">储藏地点:</span>
                                <span style="margin-left:8px;font-family:'DYmingA',serif;font-size:14px;">${item.储藏地点 || '未知'}</span>
                            </div>
                            <div>
                                <div style="display:flex;justify-content:space-between;align-items:center;">
                                    <span style="font-weight:bold;">隐秘性:</span>
                                    <span style="font-family:monospace;font-size:18px;font-weight:bold;color:${barColor};">${hidden}</span>
                                </div>
                                <div class="hide-progress-bar">
                                    <div class="hide-progress-fill" style="width:${hiddenNum}%;background:${barColor};"></div>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    let descTitle = currentMovableTab === '消耗品' ? '效用与用途' : '用途描述';
                    detailHtml += `
                        <div class="detail-section-title">${descTitle}</div>
                        <div class="detail-box-container" style="${currentMovableTab === '消耗品' ? 'min-height:120px;' : ''}">
                            <div class="detail-text">${item.用途描述 || '无'}</div>
                        </div>
                    `;
                }

                /* Bottom Cabin */
                if (currentMovableTab !== '消耗品') {
                    detailHtml += `<div class="detail-bottom-cabin">`;
                    if (item.当前状态) {
                        detailHtml += `<div class="cabin-row"><span style="font-weight:bold;color:#1c1917;">当前状态:</span> ${item.当前状态}</div>`;
                    }
                    if (item.获得途径及时间) {
                        detailHtml += `<div class="cabin-row"><span style="font-weight:bold;color:#1c1917;">获得途径及时间:</span> ${item.获得途径及时间}</div>`;
                    }
                    detailHtml += `</div>`;
                } else {
                    detailHtml += `<div class="cabin-row" style="text-align:center;background:transparent;border:none;font-weight:bold;color:#1c1917;">※ 消耗类物资无状态与来源档案</div>`;
                }

                $('#movable-detail').html(detailHtml);
            };

            /* 不动产部分逻辑 Phase 4 */
            let currentReTab = '住宅';
            let currentReItem = null;

            $('#re-tabs').on('click', '.re-tab', function() {
                $('.re-tab').removeClass('active');
                $(this).addClass('active');
                currentReTab = $(this).data('cat');
                currentReItem = null;
                renderRePanel(getAllVariables());
            });

            $('#re-list').on('click', '.re-list-item', function() {
                $('.re-list-item').removeClass('active');
                $(this).addClass('active');
                currentReItem = $(this).data('id');
                renderReDetail(getAllVariables());
            });

            const renderRePanel = (vars) => {
                const itemsObj = _.get(vars, `stat_data.不动产.${currentReTab}`, {});
                const itemKeys = Object.keys(itemsObj);

                if (itemKeys.length === 0) {
                    $('#re-list').html('<div style="padding:20px;text-align:center;color:#888;">暂无条目</div>');
                    $('#re-detail').html('');
                    return;
                }

                if (!currentReItem || !itemsObj[currentReItem]) {
                    currentReItem = itemKeys[0];
                }

                let listHtml = '';
                itemKeys.forEach(k => {
                    const item = itemsObj[k];
                    const isActive = (k === currentReItem) ? 'active' : '';
                    let titleClass = currentReTab === '住宅' ? 'house' : 'special';

                    listHtml += `
                        <div class="re-list-item ${isActive}" data-id="${k}">
                            <span class="re-item-title ${titleClass}">${k}</span>
                            <span class="re-item-badge">[${currentReTab}]</span>
                        </div>
                    `;
                });

                $('#re-list').html(listHtml);
                renderReDetail(vars);
            };

            const renderReDetail = (vars) => {
                if (!currentReItem) {
                    $('#re-detail').html('');
                    return;
                }
                const item = _.get(vars, `stat_data.不动产.${currentReTab}.${currentReItem}`, {});
                let detailHtml = '';
                let isHouse = currentReTab === '住宅';
                let titleClass = isHouse ? 'house' : 'special';

                            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(0,0,0,0.1); padding-bottom:8px;">
                                <div style="font-size:20px; font-weight:bold; color:#1C1917; font-family:'DYmingA',serif;">${currentTaskItem}</div>
                                <div style="font-size:13px; font-weight:bold; color:#2C3E50; background:rgba(0,0,0,0.05); padding:3px 8px; border-radius:4px;">对象: ${item.任务对象 || '无'}</div>
                            </div>

                            <div style="font-size:14px; line-height:1.6; display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                                <div><strong style="color:#7F8C8D;">发起日期:</strong> <span style="font-weight:bold; color:#2C3E50;">${item.发起日期 || '未知'}</span></div>
                                <div><strong style="color:#7F8C8D;">循环周期:</strong> <span style="font-weight:bold; color:#2C3E50;">${item.循环日期 || '无'}</span></div>
                            </div>

                            <div style="border-top:1px dashed rgba(0,0,0,0.1); padding-top:8px;">
                                <div style="font-weight:bold; color:#1C1917; font-size:14px; margin-bottom:4px;">【 事件内容 】</div>
                                <div style="font-size:13px; color:#2C3E50; line-height:1.6; background:rgba(0,0,0,0.02); padding:10px; border-radius:6px; border:1px solid rgba(0,0,0,0.05); font-family:'XiangcuiDengcusong',serif;">${item.事件内容 || '无'}</div>
                            </div>

                            <div style="border-top:1px dashed rgba(0,0,0,0.1); padding-top:8px;">
                                <div style="font-weight:bold; color:#1C1917; font-size:14px; margin-bottom:4px;">【 完成判定 】</div>
                                <div style="font-size:13px; color:#2C3E50; line-height:1.6; background:rgba(0,0,0,0.02); padding:10px; border-radius:6px; border:1px solid rgba(0,0,0,0.05); font-family:'XiangcuiDengcusong',serif;">${item.完成判定 || '无'}</div>
                            </div>

                            <div style="border-top:1px dashed rgba(0,0,0,0.1); padding-top:8px;">
                                <div style="font-weight:bold; color:#10B981; font-size:14px; margin-bottom:4px;">🌟 获得成果</div>
                                <div style="font-size:13px; color:#047857; line-height:1.6; background:rgba(16,185,129,0.02); padding:10px; border-radius:6px; border:1px solid rgba(16,185,129,0.1); font-family:'XiangcuiDengcusong',serif; font-weight:bold;">${item.获得成果 || '无'}</div>
                            </div>
                        </div>
                    `;
                }

                $('#task-detail').html(detailHtml);
            };

            const renderTasks = (vars) => {
                renderTaskPanel(vars);
            };

            const parseRemainCards = (remainStr) => {
                /* takes something like "石级x5丨铜级x5丨银级x5丨金级x5" */
                const parts = remainStr.split('丨');
                let html = '<div style="display:flex; gap:6px; width:100%; justify-content:space-between; margin-top:4px;">';
                parts.forEach(part => {
                    const kv = part.split('x');
                    if (kv.length === 2) {
                        const tier = kv[0].trim();
                        const qty = kv[1].trim();
                        let tierClass = 'demon-color-' + tier;
                        html += `
                            <div style="flex:1; background:rgba(0,0,0,0.35); border:1px solid rgba(255,255,255,0.05); border-radius:4px; padding:3px 0; text-align:center; display:flex; flex-direction:column; align-items:center;">
                                <span class="${tierClass}" style="font-size:10px; font-weight:bold;">${tier[0]}</span>
                                <span style="font-size:12px; font-weight:bold; color:#ecf0f1; font-family:monospace; margin-top:2px;">${qty}</span>
                            </div>
                        `;
                    }
                });
                html += '</div>';
                return html;
            };

            const renderCards = (vars) => {
                const cardSys = _.get(vars, 'stat_data.恶魔卡系统', {});
                const currentCard = cardSys.当前抽取恶魔卡 || '无';

                /* Parse tier of current drawn card to colorize */
                let currentTier = '石级';
                if (currentCard.includes('金级')) { currentTier = '金级'; }
                else if (currentCard.includes('银级')) { currentTier = '银级'; }
                else if (currentCard.includes('铜级')) { currentTier = '铜级'; }

                const currentTierClass = 'demon-color-' + currentTier;
                const currentBorderClass = 'demon-border-' + currentTier;

                /* Left Column: Status */
                const leftHtml = `
                    <div class="social-glass" style="padding: 16px; flex: 1; display:flex; flex-direction:column; gap:12px; background:rgba(20,5,5,0.6) !important; border-color:#4a1212 !important;">
                        <div style="text-align:center; border-bottom:1px solid rgba(255,0,0,0.15); padding-bottom:8px; margin-bottom:4px;">
                            <span style="font-size:16px; font-weight:bold; color:#ff4444; letter-spacing:2px; font-family:'DYmingA',serif;">👿 恶魔之契</span>
                        </div>

                        <div>
                            <div style="font-size:12px; color:#ff8888; margin-bottom:4px;">当前抽取恶魔卡:</div>
                            <div class="${currentBorderClass}" style="padding:15px; text-align:center; border: 2px dashed; border-radius:8px; font-size:16px; font-weight:bold; font-family:'DYmingA',serif; letter-spacing:1px; background:rgba(0,0,0,0.5);">
                                <span class="${currentTierClass}">${currentCard}</span>
                            </div>
                        </div>

                        <div style="background:rgba(178,58,42,0.1); border-left:4px solid #b23a2a; padding:10px; border-radius:4px; margin-top:4px;">
                            <div style="font-size:11px; color:#ffaaaa; margin-bottom:2px; font-weight:bold;">💀 恶魔卡死亡期限</div>
                            <div style="font-size:13px; font-weight:bold; color:#ff3333; font-family:monospace; letter-spacing:0.5px; animation: demonDeadPulse 1s infinite alternate;">
                                ${cardSys.恶魔卡死亡期限 || '未生效'}
                            </div>
                        </div>

                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; font-size:13px;">
                            <div style="background:rgba(0,0,0,0.3); padding:8px; border-radius:6px; border:1px solid rgba(255,255,255,0.05); text-align:center;">
                                <div style="color:#ff8888; font-size:11px; margin-bottom:2px;">目标级别</div>
                                <div style="font-weight:bold; color:#ecf0f1;">${cardSys.targetLevel || cardSys.目标级别 || '无'}</div>
                            </div>
                            <div style="background:rgba(0,0,0,0.3); padding:8px; border-radius:6px; border:1px solid rgba(255,255,255,0.05); text-align:center;">
                                <div style="color:#ff8888; font-size:11px; margin-bottom:2px;">重抽次数</div>
                                <div style="font-weight:bold; color:#ecf0f1; font-family:monospace;">${cardSys.redrawCount || cardSys.重抽次数 || 0}次</div>
                            </div>
                        </div>

                        <div style="border-top:1px dashed rgba(255,0,0,0.15); padding-top:12px; margin-top:auto; display:flex; flex-direction:column; align-items:center; justify-content:center;">
                            <div style="font-size:12px; color:#ff8888; font-weight:bold; margin-bottom:4px; letter-spacing:1px;">⚡ 恶魔点数</div>
                            <div style="font-size:26px; font-weight:bold; color:#ff3333; text-shadow:0 0 10px #ff0000, 0 0 2px #ff0000; font-family:monospace; tracking:1px;">
                                ${cardSys.恶魔点数 || 0} Pts
                            </div>
                        </div>
                    </div>
                `;

                /* Center Column: Shop (6 rounded squares) */
                const shopObj = cardSys.恶魔商城 || {};
                let shopGridHtml = '';

                /* Create slots 商品1 to 商品6 */
                for (let i = 1; i <= 6; i++) {
                    const itemKey = '商品' + i;
                    const item = shopObj[itemKey] || { 商品名称: '封印槽位', 商品简介: '等待深渊之主上架商品...', 对应品质: '石级', 需要点数: 999 };
                    const name = item.商品名称 || '空无一物';
                    const desc = item.商品简介 || '神秘的虚空之中没有任何声息...';
                    const quality = item.对应品质 || '石级';
                    const pts = item.需要点数 || 0;

                    const borderClass = 'demon-border-' + quality;
                    const colorClass = 'demon-color-' + quality;

                    shopGridHtml += `
                        <div class="${borderClass}" style="position:relative; aspect-ratio:1.1; border-radius:12px; background:rgba(0,0,0,0.55); border:2px solid; padding:10px; display:flex; flex-direction:column; justify-content:space-between; overflow:hidden; box-shadow:0 4px 10px rgba(0,0,0,0.7); transition: transform 0.2s;">
                            <!-- Info toggle trigger circle -->
                            <div class="demon-info-trigger" data-desc="${desc}" style="position:absolute; top:8px; right:8px; width:16px; height:16px; border-radius:50%; background:#2a0505; border:1px solid #ff3333; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:10; font-size:11px; font-weight:bold; color:#ff3333; box-shadow:0 0 4px #ff0000;">
                                ?
                            </div>

                            <!-- Desc Overlay (Initially hidden) -->
                            <div class="demon-shop-desc-overlay" style="display:none; position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(12,2,2,0.96); padding:10px; font-size:11px; color:#ffcccc; overflow-y:auto; line-height:1.4; z-index:9; border-radius:10px; word-break:break-all; font-family:'XiangcuiDengcusong',serif;">
                                ${desc}
                            </div>

                            <div style="margin-top:4px; text-align:center; padding:0 12px;">
                                <div style="font-size:13px; font-weight:bold; color:#ecf0f1; font-family:'DYmingA',serif; line-height:1.3; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;">
                                    ${name}
                                </div>
                            </div>

                            <!-- Hanging Blood tag -->
                            <div style="text-align:center; padding: 4px 6px; background: rgba(30,5,5,0.8); border: 1px dashed #ff3333; border-radius:4px; font-family: 'DYmingA', serif; font-size:12px; font-weight:bold; color:#ff3333; text-shadow: 1px 1px 4px #000, 0 0 8px #ff0000; letter-spacing:0.5px; transform: rotate(-2deg); transform-origin: center; margin: 4px auto 0 auto; width: fit-content; max-width:100%;">
                                👿 ${pts} Pts
                            </div>
                        </div>
                    `;
                }

                const centerHtml = `
                    <div class="social-glass" style="padding: 16px; flex: 1.4; display:flex; flex-direction:column; gap:12px; background:rgba(20,5,5,0.6) !important; border-color:#4a1212 !important;">
                        <div style="text-align:center; border-bottom:1px solid rgba(255,0,0,0.15); padding-bottom:8px; margin-bottom:4px;">
                            <span style="font-size:16px; font-weight:bold; color:#ff4444; letter-spacing:2px; font-family:'DYmingA',serif;">🛒 恶魔之馈（商城）</span>
                        </div>
                        <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:12px; flex:1; align-content:center;">
                            ${shopGridHtml}
                        </div>
                    </div>
                `;

                /* Right Column: Card Decks */
                const remainObj = cardSys.剩余恶魔卡 || {};
                const categories = ['奢靡卡', '纵欲卡', '杀戮卡', '恶意卡', '异变卡'];
                let deckHtml = '';

                categories.forEach(cat => {
                    const val = remainObj[cat] || '石级x0丨铜级x0丨银级x0丨金级x0';
                    deckHtml += `
                        <div style="background:rgba(0,0,0,0.45); border:1px solid rgba(255,0,0,0.15); border-radius:8px; padding:10px; display:flex; flex-direction:column; gap:4px; box-shadow:inset 0 0 6px rgba(0,0,0,0.5);">
                            <div style="font-size:13px; font-weight:bold; color:#ff9999; font-family:'DYmingA',serif; display:flex; justify-content:space-between; align-items:center;">
                                <span>🎴 ${cat}</span>
                            </div>
                            ${parseRemainCards(val)}
                        </div>
                    `;
                });

                const rightHtml = `
                    <div class="social-glass" style="padding: 16px; flex: 0.9; display:flex; flex-direction:column; gap:12px; background:rgba(20,5,5,0.6) !important; border-color:#4a1212 !important;">
                        <div style="text-align:center; border-bottom:1px solid rgba(255,0,0,0.15); padding-bottom:8px; margin-bottom:4px;">
                            <span style="font-size:16px; font-weight:bold; color:#ff4444; letter-spacing:2px; font-family:'DYmingA',serif;">📦 契约余量（卡盒）</span>
                        </div>
                        <div style="display:flex; flex-direction:column; gap:10px; flex:1; justify-content:center;">
                            ${deckHtml}
                        </div>
                    </div>
                `;

                const containerHtml = `
                    <div style="display:flex; gap:15px; width:100%; height:100%; align-items:stretch;">
                        ${leftHtml}
                        ${centerHtml}
                        ${rightHtml}
                    </div>
                `;

                $('#panel-cards').html(containerHtml);
            };

                renderMovablePanel(vars);
                renderSkills(vars);
                renderSocial(vars);
                renderOrg(vars);
                renderTasks(vars);
                renderCards(vars);
            };

            const render = () => {
                const vars = getAllVariables();
                renderMain(vars);
                renderOtherPanels(vars);
            };

            eventOn(Mvu.events.VARIABLE_UPDATE_ENDED, render);
            render();
        }));
    </script>
</body>
</html>
